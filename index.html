<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ember Wellness</title>
    <meta name="description" content="A gentle wellness companion. If you can take care of Ember, you can learn to take care of yourself." />
    <!-- Installable as a home-screen app (#32). Icons are temporary, not final art. -->
    <!-- With cookies: behind a sign-in gate (the private alpha), a manifest fetched
         without them would get the sign-in page, and install would lose its icon. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ember" />
    <!-- Browser and status-bar color; follows the app's theme (set below and in App). -->
    <meta name="theme-color" content="#F5F5F0" />
    <script>
      // Applies the theme before the first paint, so there's no flash of the
      // wrong theme while the save loads (the app takes over once it has).
      // 'ember_theme' caches the saved preference (see src/lib/theme.ts). With
      // no cache yet: a returning player from before themes saw light mode,
      // and a new player follows the system.
      try {
        var preference = localStorage.getItem('ember_theme');
        if (!preference && (localStorage.getItem('ember_device_id') || localStorage.getItem('ember_user_state_v2'))) {
          preference = 'light';
        }
        if (preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121212');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
